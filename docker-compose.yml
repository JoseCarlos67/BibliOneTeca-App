services:
  postgres:
    image: postgres:18-alpine
    container_name: biblioneteca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biblioneteca}
      POSTGRES_USER: ${POSTGRES_USER:-biblioneteca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 official image uses /var/lib/postgresql as the volume root.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biblioneteca} -d ${POSTGRES_DB:-biblioneteca}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
